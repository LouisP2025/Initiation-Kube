# Nom du composant (
appName: backend 

replicaCount: 1

image:
  # on utilise l'image de l'énoncé
  repository: hugosmn5/backend-3-tier                              
  pullPolicy: IfNotPresent
  # Vide : on utilise appVersion du Chart.yaml (1.1)
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# Port d'écoute de l'application dans le conteneur
containerPort: 5000                                                

service:
  type: ClusterIP
  port: 5000 

# Variables d'environnement (connexion PostgreSQL à l'exercice 3)   
env:
  - name: DB  
    value: "reviews"

resources: {}

# Test d'ouverture du port : le backend n'a pas de route /
livenessProbe:
  tcpSocket:                                                       
    port: http
readinessProbe:
  tcpSocket:                                                      
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}