# Version de l'API Kubernetes
apiVersion: apps/v1
# Type d'objet
kind: Deployment
metadata:
  name: python-api
  labels:
    app: python-api
spec:
  # Nombre de Pods
  replicas: 3
  selector:
    matchLabels:
      app: python-api
  # Modèle utilisé pour fabriquer chaque Pod
  template:
    metadata:
      # Étiquette posée sur chaque Pod
      labels:
        app: python-api
    spec:
      # conteneurs dans chaque Pod
      containers:
        - name: python-api
          # Image construite au TP 1
          image: lpellot/python-api:1.0
          ports:
            - containerPort: 8000
